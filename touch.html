<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- 手机端大小适配 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鱼雁传书</title>
     <!-- 链入css和js -->
    <link rel="stylesheet" href="css/touch.css" type="text/css">
    <script src="javascript/touch.js" defer></script>
    <!-- 减少闪烁 -->
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.write('<style>body{background:#2a2a2a;}</style>');
        }
    </script>
</head>
<body>
    <button id="theme-buttom-ID" class="theme-buttom-CL" title="主题切换~">🌙</button>
    <!-- 标题块，表示标题，留言信息，头像 -->
    <div class = "biaotiblock">
        <img src="Photo/ProfilePicture/Yves.png" alt="头像" class="touxiang">
        <h1 class = "dabiaoti">朝文夕拾</h1>
        <p class = "liuyan">独木不成春</p>
        <div class="tiaozhuan">
            <a href="home.html" class="zhuye">主页</a>
            <a href="boke.html" class="about">博客</a>
            <a href="touch.html" class="touch">联系</a>
            <a href="search.html" class="search">搜索</a>
        </div>
    </div>
    <div class="touchme">
        /联系我:
    </div>
    <div class="contact-cars">
        <div class="cards-row">

            <!-- 卡片 1：邮箱 -->
            <div class="card">
                <div class="card-inner">
                    <div class="contact-info">
                        <div class="icon">📧</div>
                        <h3 class="contact-type">邮箱</h3>
                        <p class="contact-value">Yves0428@163.com</p>
                    </div>
                    <div class="card-footer">
                        <button class="contact-btn" data-contact="邮箱" data-key="Mail">发送邮件 →</button>
                    </div>
                </div>
            </div>

            <!-- 卡片 2：QQ -->
            <div class="card">
                <div class="card-inner">
                    <div class="contact-info">
                        <div class="icon">🐧</div>
                        <h3 class="contact-type">QQ</h3>
                        <p class="contact-value">3314228099</p>
                    </div>
                    <div class="card-footer">
                       <button class="contact-btn" data-contact="QQ" data-key="QQ">QQ聊天 →</button>
                    </div>
                </div>
            </div>

            <!-- 卡片 3：微信 -->
            <div class="card">
                <div class="card-inner">
                    <div class="contact-info">
                        <div class="icon">💬</div>
                        <h3 class="contact-type">微信/电话</h3>
                        <p class="contact-value">18025892883</p>
                    </div>
                    <div class="card-footer">
                        <button class="contact-btn" data-contact="微信/电话" data-key="WeChat">联系微信 →</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 弹窗 -->
    <div class="popup-overlay" id="popupOverlay">
        <div class="popup-box">
            <button class="popup-close" id="popupClose">✕</button>
            <h2 id="popupTitle">📬 联系方式</h2>
            <p>欢迎您联系我：</p>
            <div class="popup-info" id="popupInfo">内容</div>
        </div>
    </div>
        <!-- 底部信息栏块 -->
    <div class = "footerblock">
        <p>这是底部信息栏</p>
    </div>
</body>
</html>
</body>
</html>
